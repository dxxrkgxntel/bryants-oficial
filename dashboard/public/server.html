<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100b18">
    <title>Configurar servidor | Bryvex Bot</title>
    <link rel="icon" type="image/png" sizes="128x128" href="/bot-avatar.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/appearance.js" defer></script>
    <script src="/account-menu.js" defer></script>
    <script src="/server.js" defer></script>
</head>
<body class="dashboard-page">
    <div class="app-layout">
        <aside class="sidebar">
            <a class="brand" href="/">
                <img class="brand-logo" src="/bot-avatar.png" alt="" width="44" height="44">
                <span><strong>Bryvex Bot</strong><small>Panel de control</small></span>
            </a>
            <div class="server-switch">
                <span class="eyebrow">SERVIDOR ACTIVO</span>
                <div class="active-server-row">
                    <span class="active-server-avatar" id="server-avatar" aria-hidden="true">BF</span>
                    <strong id="server-name">Cargando servidor…</strong>
                </div>
                <a class="server-change" href="/"><span aria-hidden="true">↗</span> Cambiar servidor</a>
            </div>
            <div class="nav-tools">
                <label class="module-search"><span class="sr-only">Buscar módulos</span><input id="module-search" type="search" placeholder="Buscar módulos…" autocomplete="off"></label>
                <button id="favorites-toggle" class="favorites-toggle" type="button" aria-pressed="false">☆ Favoritos</button>
            </div>
            <nav id="module-nav" aria-label="Sistemas del bot"></nav>
            <div class="sidebar-footer"><span class="online-dot"></span> Conectado a Bryvex Bot</div>
        </aside>

        <main class="main-panel">
            <header class="main-header">
                <div><div class="eyebrow">DASHBOARD</div><h1 id="page-title">Configuración del servidor</h1></div>
                <div class="header-actions">
                    <button id="member-balance-update" class="primary-button member-balance-update" type="button" hidden disabled>Actualizar balance</button>
                    <div id="header-account" class="user-area"></div>
                </div>
            </header>
            <div id="notice" class="notice" role="status" hidden></div>
            <section id="module-content" class="module-content">
                <div class="loading-card">Cargando los sistemas…</div>
            </section>
        </main>
    </div>
</body>
</html>
